<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PROJECT ARC - Auth Test</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(92%, 480px);
      padding: 40px 30px;
      text-align: center;
      border: 1px solid #168cff;
      border-radius: 20px;
      background: #0b1728;
    }

    .core {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #168cff;
      box-shadow: 0 0 35px #168cff;
    }

    .eyebrow {
      color: #58b7ff;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .description {
      color: #a8b5c7;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    #google-button {
      display: flex;
      justify-content: center;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: #10243b;
      line-height: 1.7;
    }

    .success {
      color: #72ffb0;
      font-weight: bold;
    }

    .error {
      color: #ff8b8b;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="panel">
    <div class="core"></div>

    <div class="eyebrow">PROJECT ARC · SERVER AUTH TEST</div>

    <h1>ARC SYSTEM</h1>

    <p class="description">
      Google認証＋ARCサーバー認証の<br>
      テスト専用ページです。
    </p>

    <div id="google-button"></div>

    <div id="result"></div>
  </main>

  <script>
    const GOOGLE_CLIENT_ID =
      "55474551167-7ias6igt2gds2f7v99bh9iuo5nhbh8lo.apps.googleusercontent.com";

    const ARC_AUTH_TEST_URL =
      "https://script.google.com/macros/s/AKfycbwzp9ELJbYXsIAASoXmDZKt7UrFi988zAfChWMB5fpNpiYBmEf8U-lY2NoyDDLYeaH6cQ/exec";


    function showResult(success, message) {
      const result = document.getElementById("result");

      result.style.display = "block";

      result.innerHTML = success
        ? '<div class="success">✓ ARC SERVER AUTH SUCCESS</div><div>' +
          message +
          '</div>'
        : '<div class="error">✕ ARC SERVER AUTH FAILED</div><div>' +
          message +
          '</div>';
    }


    async function handleCredentialResponse(response) {

      if (!response || !response.credential) {
        showResult(false, "Google IDトークンを取得できませんでした。");
        return;
      }

      document.getElementById("google-button").style.display = "none";

      try {

        const gasResponse = await fetch(ARC_AUTH_TEST_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            idToken: response.credential
          })
        });

        const result = await gasResponse.json();

        if (result.ok === true) {
          showResult(
            true,
            "Google IDトークンをARCサーバー側でも検証できました。"
          );
        } else {
          showResult(
            false,
            "認証結果: " + (result.reason || "UNKNOWN_ERROR")
          );
        }

      } catch (error) {

        console.error(error);

        showResult(
          false,
          "ARC認証サーバーとの通信に失敗しました。"
        );
      }
    }


    window.onload = function () {

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: false
      });

      google.accounts.id.renderButton(
        document.getElementById("google-button"),
        {
          theme: "outline",
          size: "large",
          shape: "pill",
          text: "signin_with",
          width: 280
        }
      );
    };
  </script>

</body>
</html>
